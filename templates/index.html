<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Virtual Gesture Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #111820;
        color: #f6f1e8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 15% 10%, #284653 0, #111820 42%, #0b1015 100%);
      }
      main { width: min(94vw, 1040px); margin: 0 auto; padding: 5vh 0 7vh; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
      .eyebrow { margin: 0 0 .4rem; color: #8dd6c0; font: 700 .72rem/1.2 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; color: #fffaf2; font-size: clamp(2rem, 5vw, 3.8rem); line-height: .95; font-weight: 500; }
      .status { display: inline-flex; align-items: center; gap: .45rem; padding: .55rem .75rem; border: 1px solid #45616c; border-radius: 999px; color: #c6ddd6; font: 600 .78rem system-ui, sans-serif; white-space: nowrap; }
      .status::before { width: .5rem; height: .5rem; border-radius: 50%; background: #8dd6c0; content: ""; box-shadow: 0 0 0 .2rem #8dd6c033; }
      .stage { overflow: hidden; border: 1px solid #42606a; border-radius: 12px; background: #070b0e; box-shadow: 0 22px 70px #00000066; }
      img { display: block; width: 100%; height: auto; min-height: 280px; object-fit: contain; }
      .instructions { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 1.15rem; background: #17252c; color: #c7d2d1; font: .9rem/1.45 system-ui, sans-serif; }
      .instructions strong { color: #8dd6c0; }
      @media (max-width: 600px) {
        main { padding-top: 2.5rem; }
        header { align-items: start; flex-direction: column; }
        .instructions { flex-direction: column; gap: .35rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Computer vision interface</p>
          <h1>Virtual Gesture<br>Calculator</h1>
        </div>
        <div class="status">Camera stream live</div>
      </header>
      <section class="stage">
        <img src="{{ url_for('video_feed') }}" alt="Live gesture calculator video feed">
        <div class="instructions">
          <span><strong>Gesture:</strong> pinch index + middle finger to click</span>
          <span><strong>Reset:</strong> use the CLR button</span>
        </div>
      </section>
    </main>
  </body>
</html>
